[project]
name = "ml-agentic"
version = "0.4.0"
description = "Controlled multi-provider runtime and MCP server for agentic data science"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
runtime = [
  "mcp>=2,<3",
  "github-copilot-sdk",
]

[project.scripts]
ml-agentic = "agentic_data.cli:main"
ml-agentic-mcp = "agentic_data.mcp_server:main"

[tool.ruff]
line-length = 110
